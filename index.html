<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>竞赛学习系统 - 毕业设计Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #f0f4f8; padding: 30px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #1a3a5c; margin-bottom: 30px; font-size: 32px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-top: 4px solid #1890ff; }
        .card h2 { font-size: 18px; color: #1a3a5c; margin-bottom: 16px; }
        .competition-item { padding: 10px 0; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .competition-item:last-child { border-bottom: none; }
        .badge { padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .badge-open { background: #e6f7e6; color: #52c41a; }
        .badge-closed { background: #fff1f0; color: #ff4d4f; }
        .path-stage { background: #f7f9fc; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; border-left: 3px solid #1890ff; }
        .path-stage strong { color: #1a3a5c; }
        .node-tag { display: inline-block; background: #e6f7ff; color: #1890ff; padding: 4px 14px; border-radius: 20px; margin: 3px; font-size: 13px; }
        .arrow { color: #bfbfbf; margin: 0 4px; }
        .update-item { padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .update-item:last-child { border-bottom: none; }
        .update-tag { background: #fff7e6; color: #fa8c16; padding: 2px 12px; border-radius: 12px; font-size: 12px; margin-right: 10px; }
        .update-time { color: #bfbfbf; font-size: 12px; float: right; }
        .loading { text-align: center; color: #999; padding: 20px; }
        .status-bar { background: #52c41a; color: white; text-align: center; padding: 6px; border-radius: 8px; margin-top: 30px; font-size: 14px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏆 竞赛赛题追踪与学习路径生成系统</h1>
    <p style="text-align:center;color:#888;margin-bottom:30px;">毕业设计Demo · 基于FastAPI + Vue3</p>

    <div class="grid">
        <!-- 竞赛列表 -->
        <div class="card">
            <h2>📋 竞赛追踪</h2>
            <div id="competitions"><div class="loading">加载中...</div></div>
        </div>

        <!-- 学习路径 -->
        <div class="card">
            <h2>📚 学习路径</h2>
            <div id="path"><div class="loading">加载中...</div></div>
        </div>

        <!-- 知识图谱 -->
        <div class="card">
            <h2>🧠 知识图谱</h2>
            <div id="knowledge"><div class="loading">加载中...</div></div>
        </div>

        <!-- 最新动态 -->
        <div class="card" style="grid-column: span 1;">
            <h2>🔔 最新动态</h2>
            <div id="updates"><div class="loading">加载中...</div></div>
        </div>
    </div>

    <div class="status-bar">✅ 系统运行中 · 数据每30秒自动刷新</div>
</div>

<script>
async function fetchAPI(url) {
    try {
        const resp = await fetch(url);
        return await resp.json();
    } catch(e) {
        return null;
    }
}

async function loadData() {
    // 竞赛
    const compData = await fetchAPI('http://127.0.0.1:8000/api/competitions');
    if (compData && compData.data) {
        document.getElementById('competitions').innerHTML = compData.data.map(c => `
            <div class="competition-item">
                <span>${c.name}</span>
                <span class="badge ${c.status === '报名中' ? 'badge-open' : 'badge-closed'}">${c.status}</span>
            </div>
        `).join('');
    }

    // 学习路径
    const pathData = await fetchAPI('http://127.0.0.1:8000/api/path');
    if (pathData && pathData.data && pathData.data.stages) {
        document.getElementById('path').innerHTML = pathData.data.stages.map(s => `
            <div class="path-stage">
                <strong>${s.name}</strong> (${s.duration})<br>
                <span style="font-size:13px;color:#666;">${(s.tasks || []).join(' → ')}</span>
            </div>
        `).join('');
    }

    // 知识图谱
    const kgData = await fetchAPI('http://127.0.0.1:8000/api/knowledge');
    if (kgData && kgData.data && kgData.data.nodes) {
        document.getElementById('knowledge').innerHTML = `
            <div style="margin-bottom:12px;">
                ${kgData.data.nodes.map(n => `<span class="node-tag">${n.id} (Lv.${n.level})</span>`).join(' ')}
            </div>
            <div style="font-size:13px;color:#666;">
                ${(kgData.data.edges || []).map(e => `${e.from} <span class="arrow">→</span> ${e.to}`).join('  ')}
            </div>
        `;
    }

    // 动态
    const updateData = await fetchAPI('http://127.0.0.1:8000/api/updates');
    if (updateData && updateData.data) {
        const items = Array.isArray(updateData.data) ? updateData.data : [updateData.data];
        document.getElementById('updates').innerHTML = items.map(u => `
            <div class="update-item">
                <span class="update-tag">${u.type || '通知'}</span>
                ${u.content}
                <span class="update-time">${(u.time || '').replace('T', ' ').slice(0,16)}</span>
            </div>
        `).join('');
    }
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
